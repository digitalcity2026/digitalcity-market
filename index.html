<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DigitalCity Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --bg-navy: #071126;
            --card: rgba(14, 28, 58, 0.55);
            --card-hover: rgba(20, 42, 84, 0.75);
            --border: rgba(56, 189, 248, 0.14);
            --blue-primary: #0072ff;
            --blue-light: #00c6ff;
            --blue-glow: rgba(0, 140, 255, 0.22);
            --green: #10b981;
            --red: #ef4444;
            --gold: #f59e0b;
            --text: #f8fafc;
            --text2: #94a3b8;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 5%, rgba(0, 114, 255, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 85% 30%, rgba(0, 198, 255, 0.14) 0%, transparent 50%),
                linear-gradient(180deg, #040917 0%, #07132c 50%, #030712 100%);
            background-attachment: fixed;
        }
        
        /* هدر برنامه */
        .header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(4, 10, 24, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header-logo { display: flex; align-items: center; gap: 10px; }
        .header-logo img {
            width: 38px; height: 38px; border-radius: 10px;
            background: #fff; padding: 2px;
            border: 1.5px solid var(--blue-light);
            box-shadow: 0 0 16px rgba(0, 198, 255, 0.35);
            object-fit: contain;
        }
        .header-title {
            font-size: 16px; font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, var(--blue-light) 50%, var(--blue-primary) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 0.3px;
        }
        
        .hamburger {
            width: 36px; height: 36px; background: var(--card);
            border: 1px solid var(--border); border-radius: 10px;
            cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 4px;
        }
        .hamburger span { display: block; width: 16px; height: 2px; background: var(--blue-light); border-radius: 2px; }
        
        /* منوی کشویی */
        .side-menu {
            position: fixed; top: 0; right: -320px; width: 280px; height: 100%;
            background: linear-gradient(180deg, rgba(6, 15, 36, 0.98) 0%, rgba(3, 8, 20, 0.99) 100%);
            backdrop-filter: blur(30px);
            border-left: 1px solid var(--border); z-index: 200;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 26px 18px; display: flex; flex-direction: column;
        }
        .side-menu.active { right: 0; }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 4, 12, 0.7); z-index: 150;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .overlay.active { opacity: 1; pointer-events: all; }
        
        .menu-header { text-align: center; margin-bottom: 24px; }
        .menu-header img {
            width: 60px; height: 60px; border-radius: 16px;
            background: #fff; padding: 3px;
            border: 2px solid var(--blue-light);
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.3);
        }
        .menu-header h3 { margin-top: 10px; font-size: 16px; font-weight: 900; color: #fff; }
        .menu-header p { font-size: 11px; color: var(--blue-light); margin-top: 2px; }
        .menu-links { display: flex; flex-direction: column; gap: 8px; }
        .menu-link {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px; border-radius: 12px;
            background: var(--card); border: 1px solid var(--border);
            color: var(--text); text-decoration: none;
            font-size: 13px; font-weight: 600; transition: all 0.2s;
        }
        .menu-link:active { background: var(--blue-glow); border-color: var(--blue-light); transform: scale(0.98); }
        .menu-footer { margin-top: auto; text-align: center; color: var(--text2); font-size: 11px; }
        
        /* باکس جستجو */
        .search-container {
            padding: 10px 16px 6px;
            background: rgba(4, 10, 24, 0.75);
            backdrop-filter: blur(12px);
        }
        .search-box {
            width: 100%; padding: 12px 16px; border-radius: 14px;
            background: var(--card); border: 1px solid var(--border);
            color: var(--text); font-family: 'Vazirmatn', sans-serif;
            font-size: 13px; outline: none; transition: border 0.25s;
        }
        .search-box:focus { border-color: var(--blue-light); box-shadow: 0 0 12px rgba(0, 198, 255, 0.2); }
        .search-box::placeholder { color: var(--text2); }
        
        /* تب‌های دارای ایموجی متحرک */
        .tabs {
            display: flex; gap: 6px; padding: 10px 12px;
            position: sticky; top: 58px; z-index: 50;
            background: rgba(4, 10, 24, 0.88);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            overflow-x: auto; scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            flex: 1; min-width: 64px; padding: 8px 6px; border-radius: 12px;
            border: 1px solid var(--border); background: var(--card);
            color: var(--text2); font-size: 11px; font-weight: 600;
            cursor: pointer; text-align: center; font-family: 'Vazirmatn', sans-serif;
            transition: all 0.25s; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 4px; white-space: nowrap;
        }
        .tab img.anim-emoji {
            width: 22px; height: 22px; object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
            transition: transform 0.25s;
        }
        .tab.active {
            background: linear-gradient(135deg, rgba(0, 114, 255, 0.28), rgba(0, 198, 255, 0.18));
            border-color: var(--blue-light); color: #fff; font-weight: 800;
            box-shadow: 0 4px 14px rgba(0, 114, 255, 0.25);
        }
        .tab.active img.anim-emoji { transform: scale(1.15); }
        
        .results-count {
            font-size: 11px; color: var(--blue-light); padding: 8px 16px 4px;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        /* کارت ارزها */
        .coin-list { padding: 10px 16px 28px; }
        .coin-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;
            display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
            backdrop-filter: blur(10px); transition: all 0.2s;
        }
        .coin-card:active { transform: scale(0.98); border-color: var(--blue-light); background: var(--card-hover); }
        
        .coin-rank {
            width: 26px; height: 26px; border-radius: 8px;
            background: var(--blue-glow); border: 1px solid rgba(0, 198, 255, 0.25);
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; color: var(--blue-light); flex-shrink: 0;
        }
        .coin-icon { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; }
        .coin-info { flex: 1; min-width: 95px; }
        .coin-name { font-weight: 700; font-size: 13px; color: #fff; }
        .coin-symbol { font-size: 10px; color: var(--text2); }
        .coin-price { text-align: left; flex-shrink: 0; min-width: 90px; }
        .coin-price .price { font-weight: 900; font-size: 14px; color: #fff; }
        .coin-price .change { font-size: 11px; font-weight: 600; }
        .up { color: var(--green); }
        .down { color: var(--red); }
        
        .coin-volume {
            width: 100%; font-size: 10px; color: var(--text2);
            display: flex; justify-content: space-between;
            padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.06);
        }
        
        .star-btn {
            flex-shrink: 0; width: 30px; height: 30px; border-radius: 8px;
            border: 1px solid var(--border); background: rgba(255,255,255,0.03);
            cursor: pointer; font-size: 14px; display: flex;
            align-items: center; justify-content: center; color: var(--text2);
        }
        .star-btn.starred { color: var(--gold); border-color: var(--gold); background: rgba(245,158,11,0.15); }
        
        /* کارت‌های بازار متفرقه */
        .misc-grid { display: flex; flex-direction: column; gap: 10px; }
        .misc-card {
            background: linear-gradient(135deg, rgba(14, 30, 64, 0.75), rgba(8, 18, 40, 0.85));
            border: 1px solid var(--border); border-radius: 16px;
            padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
        }
        .misc-left { display: flex; align-items: center; gap: 12px; }
        .misc-icon {
            width: 42px; height: 42px; border-radius: 12px;
            background: var(--blue-glow); border: 1px solid rgba(0, 198, 255, 0.3);
            display: flex; align-items: center; justify-content: center; font-size: 22px;
        }
        .misc-title { font-weight: 800; font-size: 14px; color: #fff; }
        .misc-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
        .misc-right { text-align: left; }
        .misc-price { font-weight: 900; font-size: 15px; color: var(--blue-light); }
        
        /* کارت‌های اخبار */
        .news-card {
            display: block; text-decoration: none; color: inherit;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 14px; margin-bottom: 10px;
            transition: all 0.2s;
        }
        .news-card:active { border-color: var(--blue-light); background: var(--card-hover); }
        .news-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 10px; }
        .news-badge {
            padding: 3px 8px; border-radius: 6px; font-weight: 700;
            background: var(--blue-glow); color: var(--blue-light);
            border: 1px solid rgba(0, 198, 255, 0.25);
        }
        .news-title { font-weight: 800; font-size: 13px; line-height: 1.7; color: #fff; margin-bottom: 6px; }
        .news-summary { font-size: 11px; color: var(--text2); line-height: 1.7; }
        
        .load-more { text-align: center; padding: 16px; }
        .load-more button {
            padding: 11px 28px; border-radius: 12px;
            background: linear-gradient(135deg, var(--blue-primary), var(--blue-light));
            border: none; color: #fff; font-family: 'Vazirmatn', sans-serif;
            font-size: 13px; font-weight: 800; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.35);
        }
        
        .section-title { font-size: 13px; font-weight: 800; margin: 14px 0 10px; color: var(--blue-light); display: flex; align-items: center; gap: 6px; }
        .empty { text-align: center; padding: 40px 16px; color: var(--text2); font-size: 13px; }
        .loading { text-align: center; padding: 40px 16px; color: var(--text2); font-size: 13px; }
        .spinner {
            width: 36px; height: 36px; border: 3px solid var(--border);
            border-top-color: var(--blue-light); border-radius: 50%;
            animation: spin 0.9s linear infinite; margin: 0 auto 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>
    
    <!-- منوی همبرگری با آیدی‌های جدید digitalcitycrypto -->
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <img src="logo.png" onerror="this.src=DEFAULT_LOGO_SVG" alt="DigitalCity">
            <h3>DigitalCity Market</h3>
            <p>@digitalcitycrypto</p>
        </div>
        <div class="menu-links">
            <a href="https://t.me/digitalcitycrypto" target="_blank" class="menu-link">
                <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#0088cc"/><path d="M5.43 11.87l8.21-3.17c.38-.16.7-.08.48.16l-1.66 1.5-1.18 1.81-.44 3.17c.08 0 .19-.08.27-.16l1.99-1.66 2.49 1.83c.46.25.79.12.9-.43l1.64-7.71c.17-.67-.26-.98-.72-.78L5.43 10.76c-.7.28-.69.67-.13.84l2.11.66 4.88-3.08c.23-.15.44-.07.27.09l-3.95 3.56-.17 2.58-.82-.28z" fill="#fff"/></svg>

            </a>
            <a href="https://instagram.com/digitalcitycrypto" target="_blank" class="menu-link">
                <svg width="22" height="22" viewBox="0 0 24 24"><defs><linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#f09433"/><stop offset="50%" stop-color="#dc2743"/><stop offset="100%" stop-color="#bc1888"/></linearGradient></defs><rect width="24" height="24" rx="6" fill="url(#ig)"/><rect x="4.5" y="4.5" width="15" height="15" rx="4" stroke="#fff" stroke-width="1.8" fill="none"/><circle cx="12" cy="12" r="3.6" stroke="#fff" stroke-width="1.8" fill="none"/><circle cx="16.3" cy="7.7" r="1.1" fill="#fff"/></svg>

            </a>
            <a href="https://youtube.com/@digitalcitycrypto" target="_blank" class="menu-link">
                <svg width="22" height="22" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#FF0000"/><path d="M19.6 8.2c-.2-.8-.8-1.4-1.6-1.6C16.6 6.2 12 6.2 12 6.2s-4.6 0-6 .4c-.8.2-1.4.8-1.6 1.6C4 9.5 4 12 4 12s0 2.5.4 3.8c.2.8.8 1.4 1.6 1.6 1.4.4 6 .4 6 .4s4.6 0 6-.4c.8-.2 1.4-.8 1.6-1.6.4-1.3.4-3.8.4-3.8s0-2.5-.4-3.8z" fill="#fff"/><path d="M10.5 15.2l4-3.2-4-3.2v6.4z" fill="#FF0000"/></svg>
                کانال یوتیوب
            </a>
            <a href="https://coinmarketcap.com/community/profile/a_abbasbeigi/" target="_blank" class="menu-link">
                <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#3861FB"/><path d="M6 8.5L12 3l6 5.5L12 14 6 8.5z" fill="#fff" opacity="0.8"/><path d="M6 12l6 5.5 6-5.5" stroke="#fff" stroke-width="1.6" fill="none"/></svg>
                پروفایل CMC
            </a>
        </div>
        <div class="menu-footer">DigitalCity Market © 2026</div>
    </div>

    <!-- هدر اصلی -->
    <div class="header">
        <div class="header-logo">
            <img id="headerLogo" src="logo.png" alt="Logo">
            <span class="header-title">DigitalCity Market</span>
        </div>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </div>
    
    <!-- جستجو -->
    <div class="search-container" id="searchContainer">
        <input type="text" class="search-box" id="searchInput" placeholder="🔍 جستجوی سریع نام یا نماد در ۱۰۰۰ ارز..." oninput="filterCoins()">
    </div>
    
    <!-- تب‌ها با ایموجی‌های متحرک -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('market', this)">
            <img class="anim-emoji" src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f4ca/512.webp" alt="📊">
            <span>بازار</span>
        </button>
        <button class="tab" onclick="switchTab('trends', this)">
            <img class="anim-emoji" src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f525/512.webp" alt="🔥">
            <span>ترندها</span>
        </button>
        <button class="tab" onclick="switchTab('misc', this)">
            <img class="anim-emoji" src="https://fonts.gstatic.com/s/e/notoemoji/latest/1fa99/512.webp" alt="🪙">
            <span>بازار متفرقه</span>
        </button>
        <button class="tab" onclick="switchTab('news', this)">
            <img class="anim-emoji" src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f30d/512.webp" alt="🌍">
            <span>اخبار</span>
        </button>
        <button class="tab" onclick="switchTab('watchlist', this)">
            <img class="anim-emoji" src="https://fonts.gstatic.com/s/e/notoemoji/latest/2b50/512.webp" alt="⭐">
            <span>واچ‌لیست</span>
        </button>
    </div>
    
    <div class="results-count" id="resultsCount"></div>
    
    <!-- محتوای تب‌ها -->
    <div class="tab-content active" id="market-tab">
        <div class="coin-list" id="marketList"><div class="loading"><div class="spinner"></div>در حال دریافت ارزهای برتر بازار...</div></div>
    </div>
    <div class="tab-content" id="trends-tab">
        <div class="coin-list" id="trendsList"></div>
    </div>
    <div class="tab-content" id="misc-tab">
        <div class="coin-list" id="miscList"></div>
    </div>
    <div class="tab-content" id="news-tab">
        <div class="coin-list" id="newsList"></div>
    </div>
    <div class="tab-content" id="watchlist-tab">
        <div class="coin-list" id="watchlistList"></div>
    </div>

<script>
    // لوگوی وکتور پیش‌فرض مشابه لوگوی آبی جدید شما (در صورتی که فایل logo.png هنوز کنار فایل نباشد)
    const DEFAULT_LOGO_SVG = "data:image/svg+xml;utf8," + encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#00c6ff"/>
          <stop offset="55%" stop-color="#0072ff"/>
          <stop offset="100%" stop-color="#002b7f"/>
        </linearGradient>
      </defs>
      <rect width="120" height="120" rx="24" fill="#ffffff"/>
      <path d="M24 20 H64 C90 20 104 38 104 60 C104 82 90 100 64 100 H24 Z" fill="none" stroke="url(#bg)" stroke-width="15" stroke-linejoin="round"/>
      <rect x="34" y="68" width="11" height="24" rx="2" fill="url(#bg)"/>
      <rect x="50" y="54" width="11" height="38" rx="2" fill="url(#bg)"/>
      <rect x="66" y="38" width="12" height="54" rx="2" fill="url(#bg)"/>
      <path d="M16 82 Q58 98 104 54" fill="none" stroke="#00b4ff" stroke-width="8" stroke-linecap="round"/>
      <polygon points="108,48 94,52 103,63" fill="#00b4ff"/>
    </svg>`);
    document.getElementById('headerLogo').onerror = function() { this.src = DEFAULT_LOGO_SVG; };

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    // اگر وب‌اپ گوگل اسکریپت را ساختید، لینک آن را اینجا قرار دهید (اختیاری - سیستم فال‌بک مستقیم هم فعال است)
    const GAS_API_URL = ""; 

    function toggleMenu() { document.getElementById('sideMenu').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
    function closeMenu() { document.getElementById('sideMenu').classList.remove('active'); document.getElementById('overlay').classList.remove('active'); }

    let currentTab = 'market', marketData = [];

    function switchTab(tab, btnEl) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        if (btnEl) btnEl.classList.add('active');
        document.getElementById(tab + '-tab').classList.add('active');

        const searchBar = document.getElementById('searchContainer');
        if (tab === 'market') searchBar.classList.remove('hidden');
        else searchBar.classList.add('hidden');

        if (tab === 'market') {
            document.getElementById('searchInput').value = '';
            if (marketData.length === 0) fetchAllCoins();
            else {
                renderCoins(marketData.slice(0, 100), document.getElementById('marketList'), false);
                document.getElementById('resultsCount').innerHTML = `<span>📊 ${marketData.length} ارز آماده</span><span>بروزرسانی زنده</span>`;
            }
        }
        if (tab === 'trends') loadTrendsTab();
        if (tab === 'misc') loadMiscTab();
        if (tab === 'news') loadNewsTab();
        if (tab === 'watchlist') loadWatchlist();
    }

    function formatPrice(price) {
        if (price == null) return 'N/A';
        if (price >= 1) return '$' + price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        if (price >= 0.01) return '$' + price.toFixed(4);
        if (price >= 0.0001) return '$' + price.toFixed(6);
        return '$' + price.toFixed(8);
    }

    function formatVolume(vol) {
        if (!vol) return 'N/A';
        if (vol >= 1e9) return '$' + (vol/1e9).toFixed(1) + 'B';
        if (vol >= 1e6) return '$' + (vol/1e6).toFixed(1) + 'M';
        if (vol >= 1e3) return '$' + (vol/1e3).toFixed(1) + 'K';
        return '$' + vol.toFixed(0);
    }

    // دریافت سریع ارزها (ابتدا ۲۵۰ ارز اول را در کمتر از ۱ ثانیه نمایش می‌دهد و بقیه را در پس‌زمینه کامل می‌کند)
    async function fetchAllCoins() {
        const container = document.getElementById('marketList');
        const cached = localStorage.getItem('dc_market_cache_v2');
        if (cached) {
            try {
                const parsed = JSON.parse(cached);
                if (parsed.data && parsed.data.length) {
                    marketData = parsed.data;
                    renderCoins(marketData.slice(0, 100), container, false);
                    document.getElementById('resultsCount').innerHTML = `<span>⚡ ${marketData.length} ارز بارگذاری شد</span>`;
                }
            } catch (e) {}
        }

        try {
            const res1 = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1&sparkline=false&price_change_percentage=24h');
            if (!res1.ok) throw new Error('Rate limit');
            const page1 = await res1.json();
            marketData = page1;
            renderCoins(marketData.slice(0, 100), container, false);
            document.getElementById('resultsCount').innerHTML = `<span>📊 ۲۵۰ ارز برتر لود شد (در حال تکمیل ۱۰۰۰ ارز...)</span>`;

            // دریافت صفحات ۲ تا ۴ با فاصله کوتاه برای جلوگیری از بلاک شدن توسط CoinGecko
            for (let p = 2; p <= 4; p++) {
                await new Promise(r => setTimeout(r, 1200));
                const rNext = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=${p}&sparkline=false&price_change_percentage=24h`);
                if (rNext.ok) {
                    const pData = await rNext.json();
                    if (Array.isArray(pData)) marketData = marketData.concat(pData);
                }
            }
            localStorage.setItem('dc_market_cache_v2', JSON.stringify({ data: marketData, time: Date.now() }));
            if (currentTab === 'market') {
                document.getElementById('resultsCount').innerHTML = `<span>📊 ${marketData.length} ارز برتر بازار</span>`;
                appendShowAllBtn(container);
            }
        } catch (e) {
            if (!marketData.length) {
                container.innerHTML = '<div class="empty">⚠️ خطا در ارتباط با سرور قیمت‌ها. لطفاً چند ثانیه دیگر تلاش کنید.</div>';
            }
        }
    }

    function appendShowAllBtn(container) {
        if (marketData.length > 100 && !document.getElementById('loadMoreBtn')) {
            const d = document.createElement('div');
            d.className = 'load-more';
            d.id = 'loadMoreBtn';
            d.innerHTML = `<button onclick="showAll()">📥 نمایش همه ${marketData.length} ارز</button>`;
            container.appendChild(d);
        }
    }

    function showAll() {
        const c = document.getElementById('marketList');
        document.getElementById('loadMoreBtn')?.remove();
        renderCoins(marketData, c, false);
    }

    function coinHTML(coin, change, isUp, inWatchlist, isWatchlist) {
        return `<div class="coin-card">
            <div class="coin-rank">${coin.market_cap_rank || '-'}</div>
            <img class="coin-icon" src="${coin.image}" alt="${coin.name}" loading="lazy">
            <div class="coin-info">
                <div class="coin-name">${coin.name}</div>
                <div class="coin-symbol">${coin.symbol?.toUpperCase()}</div>
            </div>
            <div class="coin-price">
                <div class="price">${formatPrice(coin.current_price)}</div>
                <div class="change ${isUp ? 'up' : 'down'}">${isUp ? '+' : ''}${(change || 0).toFixed(2)}%</div>
            </div>
            ${isWatchlist
                ? `<button class="star-btn" style="color:#ef4444;border-color:#ef4444;" onclick="removeWatchlist('${coin.id}')">🗑️</button>`
                : `<button class="star-btn ${inWatchlist ? 'starred' : ''}" onclick="toggleWatchlist('${coin.id}','${coin.name.replace(/'/g,"")}','${coin.symbol?.toUpperCase()}','${coin.image}')">⭐</button>`
            }
            <div class="coin-volume">
                <span>📊 حجم ۲۴h: ${formatVolume(coin.total_volume)}</span>
                <span>💰 مارکت‌کپ: ${formatVolume(coin.market_cap)}</span>
            </div>
        </div>`;
    }

    function renderCoins(coins, container, isWatchlist = false) {
        if (!coins.length) { container.innerHTML = '<div class="empty">هیچ ارزی پیدا نشد</div>'; return; }
        const watchlist = getWatchlist();
        let html = '';
        coins.forEach(coin => {
            const change = coin.price_change_percentage_24h || 0;
            const inWatchlist = watchlist.some(w => w.id === coin.id);
            html += coinHTML(coin, change, change >= 0, inWatchlist, isWatchlist);
        });
        container.innerHTML = html;
        if (!isWatchlist && currentTab === 'market' && coins.length === 100) appendShowAllBtn(container);
    }

    function filterCoins() {
        const term = document.getElementById('searchInput').value.trim().toLowerCase();
        const container = document.getElementById('marketList');
        if (!term) {
            renderCoins(marketData.slice(0, 100), container, false);
            document.getElementById('resultsCount').innerHTML = `<span>📊 ${marketData.length} ارز</span>`;
            return;
        }
        const filtered = marketData.filter(c => c.name.toLowerCase().includes(term) || c.symbol.toLowerCase().includes(term));
        document.getElementById('resultsCount').innerHTML = `<span>🔍 ${filtered.length} نتیجه یافت شد</span>`;
        renderCoins(filtered, container, false);
    }

    // تب ترندها
    function loadTrendsTab() {
        const container = document.getElementById('trendsList');
        document.getElementById('resultsCount').innerHTML = '<span>🔥 بیشترین رشد و ریزش ۲۴ ساعت اخیر</span>';
        if (!marketData.length) { container.innerHTML = '<div class="empty">⏳ در حال دریافت اطلاعات بازار...</div>'; return; }
        const valid = [...marketData].filter(c => c.price_change_percentage_24h != null);
        const gainers = [...valid].sort((a,b) => b.price_change_percentage_24h - a.price_change_percentage_24h).slice(0, 10);
        const losers = [...valid].sort((a,b) => a.price_change_percentage_24h - b.price_change_percentage_24h).slice(0, 10);

        let html = '<div class="section-title" style="color:var(--green)">🚀 ۱۰ ارز با بیشترین سود ۲۴ ساعته</div>';
        gainers.forEach(c => html += coinHTML(c, c.price_change_percentage_24h, true, getWatchlist().some(w => w.id === c.id), false));
        html += '<div class="section-title" style="color:var(--red);margin-top:22px">📉 ۱۰ ارز با بیشترین افت ۲۴ ساعته</div>';
        losers.forEach(c => html += coinHTML(c, c.price_change_percentage_24h, false, getWatchlist().some(w => w.id === c.id), false));
        container.innerHTML = html;
    }
