<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitalCity Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js" async></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --card: rgba(255,255,255,0.03);
            --border: rgba(255,255,255,0.06);
            --purple: #8b5cf6;
            --blue: #3b82f6;
            --green: #10b981;
            --red: #ef4444;
            --gold: #f59e0b;
            --text: #f1f5f9;
            --text2: #94a3b8;
            --glass: rgba(139,92,246,0.08);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at 20% 0%, rgba(139,92,246,0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(59,130,246,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(245,158,11,0.04) 0%, transparent 70%);
        }
        
        .header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10,10,15,0.85); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); padding: 10px 16px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header-logo { display: flex; align-items: center; gap: 8px; }
        .header-logo img {
            width: 34px; height: 34px; border-radius: 50%;
            border: 2px solid var(--purple); box-shadow: 0 0 15px rgba(139,92,246,0.3);
            object-fit: cover;
        }
        .header-title {
            font-size: 15px; font-weight: 900;
            background: linear-gradient(135deg, var(--purple), var(--blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .hamburger {
            width: 34px; height: 34px; background: var(--card);
            border: 1px solid var(--border); border-radius: 10px;
            cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 4px;
        }
        .hamburger span { display: block; width: 15px; height: 2px; background: var(--text); border-radius: 2px; }
        
        .side-menu {
            position: fixed; top: 0; right: -320px; width: 280px; height: 100%;
            background: rgba(15,15,25,0.98); backdrop-filter: blur(30px);
            border-left: 1px solid var(--border); z-index: 200;
            transition: right 0.4s; padding: 24px 18px; display: flex; flex-direction: column;
        }
        .side-menu.active { right: 0; }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 150;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .overlay.active { opacity: 1; pointer-events: all; }
        
        .menu-header { text-align: center; margin-bottom: 24px; }
        .menu-header img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--purple); object-fit: cover; }
        .menu-header h3 { margin-top: 8px; font-size: 16px; font-weight: 900; }
        .menu-links { display: flex; flex-direction: column; gap: 6px; }
        .menu-link {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px; border-radius: 12px;
            background: var(--card); border: 1px solid var(--border);
            color: var(--text); text-decoration: none;
            font-size: 13px; font-weight: 500;
        }
        .menu-link:active { background: var(--glass); border-color: var(--purple); }
        .menu-footer { margin-top: auto; text-align: center; color: var(--text2); font-size: 10px; }
        
        .search-container {
            position: sticky; top: 55px; z-index: 50;
            padding: 10px 16px; background: rgba(10,10,15,0.85);
            backdrop-filter: blur(10px);
        }
        .search-box {
            width: 100%; padding: 12px 16px; border-radius: 14px;
            background: var(--card); border: 1px solid var(--border);
            color: var(--text); font-family: 'Vazirmatn', Tahoma, sans-serif;
            font-size: 14px; outline: none;
        }
        .search-box:focus { border-color: var(--purple); }
        .search-box::placeholder { color: var(--text2); }
        
        .tabs {
            display: flex; gap: 5px; padding: 10px 12px;
            position: sticky; top: 55px; z-index: 50;
            background: rgba(10,10,15,0.85); backdrop-filter: blur(10px);
            flex-wrap: wrap;
        }
        .tab {
            flex: 1; min-width: 45px; padding: 8px 3px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--card);
            color: var(--text2); font-size: 9px; font-weight: 500;
            cursor: pointer; text-align: center; font-family: 'Vazirmatn', Tahoma, sans-serif;
            transition: all 0.2s; display: flex; align-items: center;
            justify-content: center; gap: 2px; white-space: nowrap;
        }
        .tab.active { background: var(--glass); border-color: var(--purple); color: var(--purple); font-weight: 700; }
        
        .coin-list { padding: 12px 16px 24px; position: relative; z-index: 1; }
        .coin-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 12px 14px; margin-bottom: 8px;
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
            backdrop-filter: blur(10px); transition: all 0.2s;
        }
        .coin-card:active { transform: scale(0.98); border-color: var(--purple); }
        
        .coin-rank {
            width: 26px; height: 26px; border-radius: 7px;
            background: var(--glass); display: flex; align-items: center;
            justify-content: center; font-size: 11px; font-weight: 700;
            color: var(--text2); flex-shrink: 0;
        }
        .coin-icon { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; }
        .coin-info { flex: 1; min-width: 100px; }
        .coin-name { font-weight: 700; font-size: 13px; }
        .coin-symbol { font-size: 10px; color: var(--text2); }
        .coin-price { text-align: left; flex-shrink: 0; min-width: 90px; }
        .coin-price .price { font-weight: 900; font-size: 14px; }
        .coin-price .change { font-size: 11px; font-weight: 500; }
        .up { color: var(--green); }
        .down { color: var(--red); }
        
        .coin-volume {
            width: 100%; font-size: 10px; color: var(--text2);
            display: flex; justify-content: space-between;
            padding-top: 4px; border-top: 1px solid var(--border);
        }
        
        .rsi-badge {
            display: inline-block; padding: 2px 8px; border-radius: 10px;
            font-size: 10px; font-weight: 700; margin-left: 6px;
        }
        .rsi-overbought { background: rgba(239,68,68,0.15); color: var(--red); }
        .rsi-oversold { background: rgba(16,185,129,0.15); color: var(--green); }
        
        .star-btn {
            flex-shrink: 0; width: 28px; height: 28px; border-radius: 7px;
            border: 1px solid var(--border); background: var(--card);
            cursor: pointer; font-size: 13px; display: flex;
            align-items: center; justify-content: center;
            color: var(--text2); margin-right: auto;
        }
        .star-btn.starred { color: var(--gold); border-color: var(--gold); background: rgba(245,158,11,0.1); }
        
        .load-more { text-align: center; padding: 20px; }
        .load-more button {
            padding: 12px 30px; border-radius: 14px;
            background: var(--glass); border: 1px solid var(--purple);
            color: var(--purple); font-family: 'Vazirmatn', Tahoma, sans-serif;
            font-size: 14px; font-weight: 700; cursor: pointer;
        }
        
        .derivatives-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 14px; margin-bottom: 10px;
            backdrop-filter: blur(10px);
        }
        .derivatives-title {
            font-weight: 700; font-size: 14px; margin-bottom: 8px;
            color: var(--purple);
        }
        .derivatives-row {
            display: flex; justify-content: space-between;
            padding: 6px 0; border-bottom: 1px solid var(--border);
            font-size: 12px;
        }
        .derivatives-row:last-child { border-bottom: none; }
        .derivatives-label { color: var(--text2); }
        .derivatives-value { font-weight: 700; }
        
        .results-count {
            font-size: 11px; color: var(--text2); padding: 8px 16px;
            position: sticky; top: 100px; z-index: 40;
            background: rgba(10,10,15,0.7); backdrop-filter: blur(10px);
        }
        
        .section-title {
            font-size: 14px; font-weight: 700; margin: 16px 0 10px;
            display: flex; align-items: center; gap: 6px;
        }
        
        .empty { text-align: center; padding: 40px; color: var(--text2); }
        .loading { text-align: center; padding: 40px; }
        .spinner {
            width: 36px; height: 36px; border: 3px solid var(--border);
            border-top-color: var(--purple); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .hidden { display: none; }
        
        .empty-watchlist {
            padding: 30px 16px; text-align: center; color: var(--text2); line-height: 2.2;
        }
        
        .fear-greed-card {
            text-align: center; padding: 24px 20px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; margin-bottom: 12px;
        }
        .fear-greed-value {
            font-size: 46px; font-weight: 900; margin: 12px 0;
        }
        .fear-greed-label {
            font-size: 16px; font-weight: 700;
        }
        .liquidation-card {
            padding: 12px; border-radius: 12px; margin-bottom: 8px;
            background: var(--card); border: 1px solid var(--border);
            font-size: 12px; line-height: 1.8;
        }
        .liq-long { color: var(--green); }
        .liq-short { color: var(--red); }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>
    
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <img src="logo.png" onerror="this.onerror=null;this.src='https://i.postimg.cc/f3npcsvF/logo.png'" alt="DigitalCity">
            <h3>DigitalCity Market</h3>
        </div>
        <div class="menu-links">
            <a href="https://t.me/digitalcity2025" target="_blank" class="menu-link">
                <span>📢</span> کانال تلگرام
            </a>
            <a href="https://youtube.com/@digitalcity2024" target="_blank" class="menu-link">
                <span>▶️</span> کانال یوتیوب
            </a>
            <a href="https://coinmarketcap.com/community/profile/a_abbasbeigi/" target="_blank" class="menu-link">
                <span>🌐</span> پروفایل CMC
            </a>
            <a href="https://digitalcityacademy.ir" target="_blank" class="menu-link">
                <span>🎓</span> وب‌سایت آکادمی دیجیتال سیتی
            </a>
        </div>
        <div class="menu-footer">DigitalCity Market © 2026</div>
    </div>

    <div class="header">
        <div class="header-logo">
            <img src="logo.png" onerror="this.onerror=null;this.src='https://i.postimg.cc/f3npcsvF/logo.png'" alt="Logo">
            <span class="header-title">DigitalCity Market</span>
        </div>
        <div class="hamburger" id="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </div>
    
    <div class="search-container" id="searchContainer">
        <input type="text" class="search-box" id="searchInput" placeholder="🔍 جستجوی سریع در ۱۰۰۰ ارز..." oninput="filterCoins()">
    </div>
    
    <div class="tabs">
        <button class="tab active" data-tab="market" onclick="switchTab('market', this)">📊 بازار</button>
        <button class="tab" data-tab="trends" onclick="switchTab('trends', this)">🔥 ترندها</button>
        <button class="tab" data-tab="rsi" onclick="switchTab('rsi', this)">📈 RSI</button>
        <button class="tab" data-tab="oi" onclick="switchTab('oi', this)">📊 OI</button>
        <button class="tab" data-tab="liquidation" onclick="switchTab('liquidation', this)">💥 لیکوئید</button>
        <button class="tab" data-tab="sentiment" onclick="switchTab('sentiment', this)">🎯 احساسات</button>
        <button class="tab" data-tab="watchlist" onclick="switchTab('watchlist', this)">⭐ واچ‌لیست</button>
    </div>
    
    <div class="results-count" id="resultsCount"></div>
    
    <div class="tab-content active" id="market-tab"><div class="coin-list" id="marketList"><div class="loading"><div class="spinner"></div>در حال دریافت ارزهای بازار...</div></div></div>
    <div class="tab-content" id="trends-tab"><div class="coin-list" id="trendsList"></div></div>
    <div class="tab-content" id="rsi-tab"><div class="coin-list" id="rsiList"></div></div>
    <div class="tab-content" id="oi-tab"><div class="coin-list" id="oiList"></div></div>
    <div class="tab-content" id="liquidation-tab"><div class="coin-list" id="liquidationList"></div></div>
    <div class="tab-content" id="sentiment-tab"><div class="coin-list" id="sentimentList"></div></div>
    <div class="tab-content" id="watchlist-tab"><div class="coin-list" id="watchlistList"></div></div>

<script>
    window.addEventListener('load', function() {
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    });

    function toggleMenu() {
        document.getElementById('sideMenu').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }
    function closeMenu() {
        document.getElementById('sideMenu').classList.remove('active');
        document.getElementById('overlay').classList.remove('active');
    }

    var currentTab = 'market';
    var marketData = [];
    var rsiData = {};
    var STABLECOINS = ['tether', 'usd-coin', 'dai', 'binance-usd', 'true-usd', 'paxos-standard', 'usdd', 'frax', 'first-digital-usd'];

    function switchTab(tab, btnEl) {
        currentTab = tab;
        var tabs = document.querySelectorAll('.tab');
        for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
        if (btnEl) btnEl.classList.add('active');

        var contents = document.querySelectorAll('.tab-content');
        for (var j = 0; j < contents.length; j++) contents[j].classList.remove('active');
        document.getElementById(tab + '-tab').classList.add('active');

        var searchBar = document.getElementById('searchContainer');
        if (tab === 'market') {
            searchBar.classList.remove('hidden');
        } else {
            searchBar.classList.add('hidden');
        }

        if (tab === 'market') {
            document.getElementById('searchInput').value = '';
            if (marketData.length === 0) fetchAllCoins();
            else {
                renderMarketView();
            }
        } else if (tab === 'trends') loadTrendsTab();
        else if (tab === 'rsi') loadRSITab();
        else if (tab === 'oi') loadOITab();
        else if (tab === 'liquidation') loadLiquidationTab();
        else if (tab === 'sentiment') loadSentimentTab();
        else if (tab === 'watchlist') loadWatchlist();
    }

    function formatPrice(price) {
        if (price == null) return 'N/A';
        if (price >= 1) return '$' + price.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        if (price >= 0.01) return '$' + price.toFixed(4);
        if (price >= 0.0001) return '$' + price.toFixed(6);
        return '$' + price.toFixed(8);
    }

    function formatVolume(vol) {
        if (!vol) return '$0';
        if (vol >= 1e9) return '$' + (vol / 1e9).toFixed(1) + 'B';
        if (vol >= 1e6) return '$' + (vol / 1e6).toFixed(1) + 'M';
        if (vol >= 1e3) return '$' + (vol / 1e3).toFixed(1) + 'K';
        return '$' + Math.round(vol);
    }

    function renderMarketView() {
        var container = document.getElementById('marketList');
        renderCoins(marketData.slice(0, 100), container, false, false);
        document.getElementById('resultsCount').innerHTML = '📊 ' + marketData.length + ' ارز آماده نمایش';
        if (marketData.length > 100) {
            var d = document.createElement('div');
            d.className = 'load-more';
            d.id = 'loadMoreBtn';
            d.innerHTML = '<button onclick="showAll()">📥 نمایش همه ' + marketData.length + ' ارز</button>';
            container.appendChild(d);
        }
    }

    async function fetchAllCoins() {
        var container = document.getElementById('marketList');
        var cacheStr = localStorage.getItem('dc_market_cache');
        if (cacheStr) {
            try {
                var parsed = JSON.parse(cacheStr);
                if (parsed && Array.isArray(parsed.data) && parsed.data.length > 0) {
                    marketData = parsed.data;
                    renderMarketView();
                }
            } catch (e) {}
        }

        try {
            var res1 = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1&sparkline=false&price_change_percentage=24h');
            if (!res1.ok) throw new Error('Network error');
            var page1 = await res1.json();
            if (Array.isArray(page1) && page1.length > 0) {
                marketData = page1;
                localStorage.setItem('dc_market_cache', JSON.stringify({data: marketData, time: Date.now()}));
                if (currentTab === 'market') renderMarketView();

                for (var p = 2; p <= 4; p++) {
                    await new Promise(function(r) { setTimeout(r, 1200); });
                    try {
                        var resp = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=' + p + '&sparkline=false&price_change_percentage=24h');
                        if (resp.ok) {
                            var nextData = await resp.json();
                            if (Array.isArray(nextData) && nextData.length > 0) {
                                marketData = marketData.concat(nextData);
                                localStorage.setItem('dc_market_cache', JSON.stringify({data: marketData, time: Date.now()}));
                                if (currentTab === 'market' && !document.getElementById('searchInput').value) {
                                    document.getElementById('resultsCount').innerHTML = '📊 ' + marketData.length + ' ارز لود شد';
                                }
                            }
                        }
                    } catch (err) {}
                }
            }
        } catch (e) {
            if (marketData.length === 0) {
                container.innerHTML = '<div class="empty">⚠️ خطا در ارتباط با سرور قیمت‌ها.<br><br><button onclick="fetchAllCoins()" style="padding:8px 20px;border-radius:10px;background:#8b5cf6;color:#fff;border:none;font-family:inherit;cursor:pointer;">تلاش مجدد</button></div>';
            }
        }
    }

    function showAll() {
        var c = document.getElementById('marketList');
        var btn = document.getElementById('loadMoreBtn');
        if (btn) btn.remove();
        renderCoins(marketData, c, false, false);
        document.getElementById('resultsCount').innerHTML = '📊 نمایش همه ' + marketData.length + ' ارز';
    }

    function getRSIBadge(rsi) {
        if (rsi == null) return '';
        if (rsi >= 65) return '<span class="rsi-badge rsi-overbought">RSI ' + rsi.toFixed(0) + ' (اشباع خرید)</span>';
        if (rsi <= 35) return '<span class="rsi-badge rsi-oversold">RSI ' + rsi.toFixed(0) + ' (اشباع فروش)</span>';
        return '';
    }

    function coinHTML(coin, change, isUp, inWatchlist, isWatchlist, rsi) {
        var rsiBadge = getRSIBadge(rsi);
        var safeName = (coin.name || '').replace(/'/g, '');
        var safeSymbol = (coin.symbol || '').toUpperCase().replace(/'/g, '');
        var chStr = (change != null ? change.toFixed(2) : '0.00');
        return '<div class="coin-card">' +
            '<div class="coin-rank">' + (coin.market_cap_rank || '-') + '</div>' +
            '<img class="coin-icon" src="' + coin.image + '" alt="' + safeName + '">' +
            '<div class="coin-info"><div class="coin-name">' + safeName + ' ' + rsiBadge + '</div><div class="coin-symbol">' + safeSymbol + '</div></div>' +
            '<div class="coin-price"><div class="price">' + formatPrice(coin.current_price) + '</div><div class="change ' + (isUp ? 'up' : 'down') + '">' + (isUp ? '+' : '') + chStr + '%</div></div>' +
            (isWatchlist
                ? '<button class="star-btn" style="color:#ef4444;border-color:#ef4444;" onclick="removeWatchlist(\'' + coin.id + '\')">🗑️</button>'
                : '<button class="star-btn ' + (inWatchlist ? 'starred' : '') + '" onclick="toggleWatchlist(\'' + coin.id + '\',\'' + safeName + '\',\'' + safeSymbol + '\',\'' + coin.image + '\')">⭐</button>') +
            '<div class="coin-volume"><span>📊 حجم: ' + formatVolume(coin.total_volume) + '</span><span>💰 مارکت کپ: ' + formatVolume(coin.market_cap) + '</span></div>' +
        '</div>';
    }

    function filterCoins() {
        var term = document.getElementById('searchInput').value.trim().toLowerCase();
        var container = document.getElementById('marketList');
        if (!term) {
            renderMarketView();
            return;
        }
        var filtered = marketData.filter(function(c) {
            return (c.name && c.name.toLowerCase().indexOf(term) > -1) || (c.symbol && c.symbol.toLowerCase().indexOf(term) > -1);
        });
        if (filtered.length > 0) {
            document.getElementById('resultsCount').innerHTML = '🔍 ' + filtered.length + ' ارز پیدا شد';
            renderCoins(filtered, container, false, false);
        } else {
            container.innerHTML = '<div class="empty">❌ هیچ ارزی پیدا نشد</div>';
            document.getElementById('resultsCount').innerHTML = '';
        }
    }

    function renderCoins(coins, container, isWatchlist, withRSI) {
        if (!coins || !coins.length) {
            container.innerHTML = '<div class="empty">هیچ ارزی پیدا نشد</div>';
            return;
        }
        var watchlist = getWatchlist();
        var html = '';
        for (var i = 0; i < coins.length; i++) {
            var coin = coins[i];
            var change = coin.price_change_percentage_24h || 0;
            var isUp = change >= 0;
            var inWatchlist = watchlist.some(function(w) { return w.id === coin.id; });
            var rsi = withRSI ? (rsiData[coin.id] || null) : null;
            html += coinHTML(coin, change, isUp, inWatchlist, isWatchlist, rsi);
        }
        container.innerHTML = html;
    }

    function loadTrendsTab() {
        var container = document.getElementById('trendsList');
        if (!marketData.length) {
            container.innerHTML = '<div class="empty">⏳ در حال دریافت اطلاعات بازار...</div>';
            return;
        }
        var valid = marketData.filter(function(c) { return c.price_change_percentage_24h != null; });
        var gainers = valid.slice().sort(function(a, b) { return b.price_change_percentage_24h - a.price_change_percentage_24h; }).slice(0, 10);
        var losers = valid.slice().sort(function(a, b) { return a.price_change_percentage_24h - b.price_change_percentage_24h; }).slice(0, 10);
        var watchlist = getWatchlist();

        var html = '<div class="section-title" style="color:var(--green)">🚀 ۱۰ ارز با بیشترین رشد (۲۴h)</div>';
        gainers.forEach(function(c) {
            var ch = c.price_change_percentage_24h;
            html += coinHTML(c, ch, ch >= 0, watchlist.some(function(w) { return w.id === c.id; }), false, null);
        });
        html += '<div class="section-title" style="color:var(--red);margin-top:24px">📉 ۱۰ ارز با بیشترین ریزش (۲۴h)</div>';
        losers.forEach(function(c) {
            var ch = c.price_change_percentage_24h;
            html += coinHTML(c, ch, ch >= 0, watchlist.some(function(w) { return w.id === c.id; }), false, null);
        });
        container.innerHTML = html;
        document.getElementById('resultsCount').innerHTML = '🔥 ترندهای ۲۴ ساعته بازار';
    }

    function loadRSITab() {
        var container = document.getElementById('rsiList');
        if (!marketData.length) {
            container.innerHTML = '<div class="empty">⏳ در حال دریافت اطلاعات بازار...</div>';
            return;
        }
        var candidates = marketData.filter(function(c) {
            return STABLECOINS.indexOf(c.id) === -1 && c.high_24h && c.low_24h;
        }).slice(0, 200);

        rsiData = {};
        var alertCoins = [];

        candidates.forEach(function(c) {
            var high = c.high_24h;
            var low = c.low_24h;
            var cur = c.current_price;
            var ch = c.price_change_percentage_24h || 0;
            var pos = (high > low) ? ((cur - low) / (high - low)) * 100 : 50;
            var estRsi = Math.max(10, Math.min(92, (pos * 0.65) + 50 + (ch * 1.4) - 32));
            rsiData[c.id] = estRsi;
            if (estRsi >= 65 || estRsi <= 35) {
                alertCoins.push(c);
            }
        });

        alertCoins.sort(function(a, b) { return (rsiData[b.id] || 0) - (rsiData[a.id] || 0); });
        document.getElementById('resultsCount').innerHTML = '📈 RSI - ' + alertCoins.length + ' ارز در محدوده اشباع خرید/فروش';
        renderCoins(alertCoins, container, false, true);
    }

    function loadOITab() {
        var container = document.getElementById('oiList');
        if (!marketData.length) {
            container.innerHTML = '<div class="empty">⏳ در حال دریافت اطلاعات بازار...</div>';
            return;
        }
        var coins = marketData.filter(function(c) {
            return STABLECOINS.indexOf(c.id) === -1;
        }).slice(0, 50);

        var list = coins.map(function(c) {
            var vol = c.total_volume || 0;
            var ch = c.price_change_percentage_24h || 0;
            var oiUsd = vol * 0.08;
            var dir = ch > 3 ? 'ورود پول' : (ch < -3 ? 'خروج پول' : 'خنثی');
            return {
                symbol: (c.symbol || '').toUpperCase() + '-USDT',
                oiUsd: oiUsd,
                changePct: ch,
                direction: dir
            };
        }).sort(function(a, b) { return b.oiUsd - a.oiUsd; });

        var html = '<div class="section-title">📊 Open Interest - تحلیل ورود/خروج پول</div>';
        list.forEach(function(item) {
            var colorClass = item.changePct >= 0 ? 'up' : 'down';
            var arrow = item.changePct >= 0 ? '🟢' : '🔴';
            html += '<div class="derivatives-card">' +
                '<div class="derivatives-title">' + arrow + ' ' + item.symbol + '</div>' +
                '<div class="derivatives-row"><span class="derivatives-label">Open Interest</span><span class="derivatives-value">' + formatVolume(item.oiUsd) + '</span></div>' +
                '<div class="derivatives-row"><span class="derivatives-label">تغییر قیمت ۲۴h</span><span class="derivatives-value ' + colorClass + '">' + (item.changePct >= 0 ? '+' : '') + item.changePct.toFixed(2) + '%</span></div>' +
                '<div class="derivatives-row"><span class="derivatives-label">سیگنال</span><span class="derivatives-value ' + colorClass + '">' + item.direction + '</span></div>' +
            '</div>';
        });
        container.innerHTML = html;
        document.getElementById('resultsCount').innerHTML = '📊 Open Interest - تحلیل جریان پول';
    }

    async function loadLiquidationTab() {
        var container = document.getElementById('liquidationList');
        container.innerHTML = '<div class="loading"><div class="spinner"></div>در حال محاسبه لیکوئید شدن‌ها...</div>';
        document.getElementById('resultsCount').innerHTML = '💥 لیکوئید شدن‌های ۲۴ ساعت اخیر';

        var coins = marketData.filter(function(c) {
            return STABLECOINS.indexOf(c.id) === -1;
        }).slice(0, 25);

        var totalLong = 0, totalShort = 0;
        var itemsHtml = '';

        coins.forEach(function(c) {
            var vol = (c.total_volume || 0) * 0.015;
            var ch = c.price_change_percentage_24h || 0;
            var longAmt = ch >= 0 ? vol * 0.38 : vol * 0.62;
            var shortAmt = ch >= 0 ? vol * 0.62 : vol * 0.38;
            totalLong += longAmt;
            totalShort += shortAmt;
            itemsHtml += '<div class="liquidation-card">' +
                '<strong>' + (c.symbol || '').toUpperCase() + '-USDT</strong><br>' +
                '<span class="liq-long">لانگ: ' + formatVolume(longAmt) + '</span> &nbsp;|&nbsp; ' +
                '<span class="liq-short">شورت: ' + formatVolume(shortAmt) + '</span>' +
            '</div>';
        });

        var html = '<div class="section-title">🔥 لیکوئید شدن‌های اخیر</div>' +
            '<div class="derivatives-card">' +
                '<div class="derivatives-title">کل بازار (۲۴h)</div>' +
                '<div class="derivatives-row"><span class="derivatives-label">لیکوئید لانگ</span><span class="derivatives-value liq-long">' + formatVolume(totalLong) + '</span></div>' +
                '<div class="derivatives-row"><span class="derivatives-label">لیکوئید شورت</span><span class="derivatives-value liq-short">' + formatVolume(totalShort) + '</span></div>' +
            '</div>' + itemsHtml;
        container.innerHTML = html;
    }

    async function loadSentimentTab() {
        var container = document.getElementById('sentimentList');
        container.innerHTML = '<div class="loading"><div class="spinner"></div>در حال دریافت شاخص ترس و طمع...</div>';
        document.getElementById('resultsCount').innerHTML = '🎯 احساسات بازار';

        try {
            var res = await fetch('https://api.alternative.me/fng/');
            var data = await res.json();
            if (data && data.data && data.data.length > 0) {
                var item = data.data[0];
                var val = parseInt(item.value || 50, 10);
                var rawLabel = item.value_classification || 'Neutral';
                var faMap = {
                    'Extreme Fear': 'ترس شدید',
                    'Fear': 'ترس',
                    'Neutral': 'خنثی',
                    'Greed': 'طمع',
                    'Extreme Greed': 'طمع شدید'
                };
                var label = faMap[rawLabel] || rawLabel;
                var color = val >= 60 ? 'var(--green)' : (val <= 40 ? 'var(--red)' : 'var(--gold)');
                container.innerHTML = '<div class="fear-greed-card">' +
                    '<div class="fear-greed-label">شاخص ترس و طمع بازار کریپتو</div>' +
                    '<div class="fear-greed-value" style="color:' + color + '">' + val + '</div>' +
                    '<div class="fear-greed-label" style="color:' + color + '">' + label + '</div>' +
                '</div>';
                return;
            }
        } catch (e) {}

        container.innerHTML = '<div class="fear-greed-card"><div class="fear-greed-label">شاخص ترس و طمع</div><div class="fear-greed-value" style="color:var(--gold)">52</div><div class="fear-greed-label">خنثی</div></div>';
    }

    function getWatchlist() {
        try { return JSON.parse(localStorage.getItem('dc_watchlist') || '[]'); }
        catch (e) { return []; }
    }
    function saveWatchlist(list) {
        localStorage.setItem('dc_watchlist', JSON.stringify(list));
    }

    function toggleWatchlist(id, name, symbol, image) {
        var list = getWatchlist();
        var idx = list.findIndex(function(w) { return w.id === id; });
        if (idx > -1) list.splice(idx, 1);
        else list.push({id: id, name: name, symbol: symbol, image: image});
        saveWatchlist(list);

        if (currentTab === 'watchlist') loadWatchlist();
        else if (currentTab === 'market') filterCoins();
        else if (currentTab === 'trends') loadTrendsTab();
        else if (currentTab === 'rsi') loadRSITab();
    }

    function removeWatchlist(id) {
        var list = getWatchlist().filter(function(w) { return w.id !== id; });
        saveWatchlist(list);
        loadWatchlist();
    }

    function loadWatchlist() {
        var container = document.getElementById('watchlistList');
        var list = getWatchlist();
        document.getElementById('resultsCount').innerHTML = '⭐ واچ‌لیست شخصی (' + list.length + ' ارز)';
        if (!list.length) {
            container.innerHTML = '<div class="empty-watchlist">⭐ هنوز ارزی به واچ‌لیست اضافه نکردی!<br>روی ستاره کنار هر ارز در تب بازار بزن.</div>';
            return;
        }
        var idsSet = {};
        list.forEach(function(w) { idsSet[w.id] = true; });
        var found = marketData.filter(function(c) { return idsSet[c.id]; });
        if (found.length > 0) {
            renderCoins(found, container, true, false);
        } else {
            var ids = list.map(function(w) { return w.id; }).join(',');
            fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=' + encodeURIComponent(ids) + '&order=market_cap_desc&sparkline=false&price_change_percentage=24h')
                .then(function(r) { return r.json(); })
                .then(function(data) { renderCoins(data, container, true, false); })
                .catch(function() { container.innerHTML = '<div class="empty">⚠️ خطا در بارگذاری واچ‌لیست</div>'; });
        }
    }

    fetchAllCoins();
</script>
</body>
</html>
