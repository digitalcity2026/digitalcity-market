<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitalCity Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');
        
        :root {
            --bg: #0a0a0f;
            --card: rgba(255,255,255,0.03);
            --border: rgba(255,255,255,0.06);
            --purple: #8b5cf6;
            --blue: #3b82f6;
            --green: #10b981;
            --red: #ef4444;
            --gold: #f59e0b;
            --text: #f1f5f9;
            --text2: #94a3b8;
            --glass: rgba(139,92,246,0.08);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at 20% 0%, rgba(139,92,246,0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(59,130,246,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(245,158,11,0.04) 0%, transparent 70%);
        }
        
        .header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10,10,15,0.85); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); padding: 10px 16px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header-logo { display: flex; align-items: center; gap: 8px; }
        .header-logo img {
            width: 34px; height: 34px; border-radius: 50%;
            border: 2px solid var(--purple); box-shadow: 0 0 15px rgba(139,92,246,0.3);
        }
        .header-title {
            font-size: 15px; font-weight: 900;
            background: linear-gradient(135deg, var(--purple), var(--blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .hamburger {
            width: 34px; height: 34px; background: var(--card);
            border: 1px solid var(--border); border-radius: 10px;
            cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 4px;
        }
        .hamburger span { display: block; width: 15px; height: 2px; background: var(--text); border-radius: 2px; }
        
        .side-menu {
            position: fixed; top: 0; right: -320px; width: 280px; height: 100%;
            background: rgba(15,15,25,0.98); backdrop-filter: blur(30px);
            border-left: 1px solid var(--border); z-index: 200;
            transition: right 0.4s cubic-bezier(0.4,0,0.2,1);
            padding: 24px 18px; display: flex; flex-direction: column;
        }
        .side-menu.active { right: 0; }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 150;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .overlay.active { opacity: 1; pointer-events: all; }
        
        .menu-header { text-align: center; margin-bottom: 24px; }
        .menu-header img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--purple); }
        .menu-header h3 { margin-top: 8px; font-size: 16px; font-weight: 900; }
        .menu-links { display: flex; flex-direction: column; gap: 6px; }
        .menu-link {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px; border-radius: 12px;
            background: var(--card); border: 1px solid var(--border);
            color: var(--text); text-decoration: none;
            font-size: 13px; font-weight: 500;
        }
        .menu-link:active { background: var(--glass); border-color: var(--purple); }
        .menu-footer { margin-top: auto; text-align: center; color: var(--text2); font-size: 10px; }
        
        .search-container {
            position: sticky; top: 55px; z-index: 50;
            padding: 10px 16px; background: rgba(10,10,15,0.85);
            backdrop-filter: blur(10px);
        }
        .search-box {
            width: 100%; padding: 12px 16px; border-radius: 14px;
            background: var(--card); border: 1px solid var(--border);
            color: var(--text); font-family: 'Vazirmatn', sans-serif;
            font-size: 14px; outline: none; transition: all 0.3s;
        }
        .search-box:focus { border-color: var(--purple); }
        .search-box::placeholder { color: var(--text2); }
        
        .tabs {
            display: flex; gap: 6px; padding: 10px 16px;
            position: sticky; top: 55px; z-index: 50;
            background: rgba(10,10,15,0.85); backdrop-filter: blur(10px);
            flex-wrap: wrap;
        }
        .tab {
            flex: 1; min-width: 55px; padding: 9px 5px; border-radius: 12px;
            border: 1px solid var(--border); background: var(--card);
            color: var(--text2); font-size: 10px; font-weight: 500;
            cursor: pointer; text-align: center; font-family: 'Vazirmatn', sans-serif;
            transition: all 0.3s; display: flex; align-items: center;
            justify-content: center; gap: 3px; white-space: nowrap;
        }
        .tab.active { background: var(--glass); border-color: var(--purple); color: var(--purple); font-weight: 700; }
        .tab svg { flex-shrink: 0; width: 12px; height: 12px; }
        
        .coin-list { padding: 20px 16px 20px; position: relative; z-index: 1; }
        .coin-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 12px 14px; margin-bottom: 8px;
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
            backdrop-filter: blur(10px); transition: all 0.3s;
        }
        .coin-card:active { transform: scale(0.98); border-color: var(--purple); }
        
        .coin-rank {
            width: 26px; height: 26px; border-radius: 7px;
            background: var(--glass); display: flex; align-items: center;
            justify-content: center; font-size: 11px; font-weight: 700;
            color: var(--text2); flex-shrink: 0;
        }
        .coin-icon { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; }
        .coin-info { flex: 1; min-width: 100px; }
        .coin-name { font-weight: 700; font-size: 13px; }
        .coin-symbol { font-size: 10px; color: var(--text2); }
        .coin-price { text-align: left; flex-shrink: 0; min-width: 100px; }
        .coin-price .price { font-weight: 900; font-size: 14px; }
        .coin-price .change { font-size: 11px; font-weight: 500; }
        .up { color: var(--green); }
        .down { color: var(--red); }
        
        .coin-volume {
            width: 100%; font-size: 10px; color: var(--text2);
            display: flex; justify-content: space-between;
            padding-top: 4px; border-top: 1px solid var(--border);
        }
        
        .rsi-badge {
            display: inline-block; padding: 2px 8px; border-radius: 10px;
            font-size: 10px; font-weight: 700; margin-right: 6px;
        }
        .rsi-overbought { background: rgba(239,68,68,0.15); color: var(--red); }
        .rsi-oversold { background: rgba(16,185,129,0.15); color: var(--green); }
        
        .star-btn {
            flex-shrink: 0; width: 28px; height: 28px; border-radius: 7px;
            border: 1px solid var(--border); background: var(--card);
            cursor: pointer; font-size: 13px; display: flex;
            align-items: center; justify-content: center;
            color: var(--text2); margin-right: auto;
        }
        .star-btn.starred { color: var(--gold); border-color: var(--gold); background: rgba(245,158,11,0.1); }
        
        .load-more {
            text-align: center; padding: 20px;
        }
        .load-more button {
            padding: 12px 30px; border-radius: 14px;
            background: var(--glass); border: 1px solid var(--purple);
            color: var(--purple); font-family: 'Vazirmatn', sans-serif;
            font-size: 14px; font-weight: 700; cursor: pointer;
        }
        
        .news-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 14px; margin-bottom: 10px;
            backdrop-filter: blur(10px); transition: all 0.3s;
        }
        .news-card:active { border-color: var(--purple); }
        .news-title {
            font-weight: 700; font-size: 14px; margin-bottom: 8px;
            line-height: 1.5; color: var(--text);
        }
        .news-title a { color: var(--text); text-decoration: none; }
        .news-meta {
            display: flex; justify-content: space-between;
            font-size: 10px; color: var(--text2); margin-bottom: 6px;
        }
        .news-source {
            display: inline-block; padding: 2px 8px; border-radius: 8px;
            font-size: 9px; font-weight: 700; margin-right: 6px;
            background: var(--glass); color: var(--purple);
        }
        .news-original {
            font-size: 10px; color: var(--text2); direction: ltr;
            text-align: left; opacity: 0.7; margin-top: 4px;
        }
        
        .results-count {
            font-size: 11px; color: var(--text2); padding: 8px 16px;
            position: sticky; top: 100px; z-index: 40;
            background: rgba(10,10,15,0.7); backdrop-filter: blur(10px);
        }
        
        .section-title {
            font-size: 14px; font-weight: 700; margin: 20px 0 10px;
            display: flex; align-items: center; gap: 6px;
        }
        
        .empty { text-align: center; padding: 40px; color: var(--text2); }
        .loading { text-align: center; padding: 40px; }
        .spinner {
            width: 36px; height: 36px; border: 3px solid var(--border);
            border-top-color: var(--purple); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .hidden { display: none; }
        
        .empty-watchlist {
            padding: 30px 16px; text-align: center; color: var(--text2); line-height: 2.2;
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>
    
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <img src="https://i.postimg.cc/f3npcsvF/logo.png" alt="DigitalCity">
            <h3>DigitalCity Market</h3>
        </div>
        <div class="menu-links">
            <a href="https://t.me/digitalcity2025" target="_blank" class="menu-link">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0z" fill="#0088cc"/><path d="M5.431 11.873l8.208-3.168c.38-.161.704-.083.483.161l-1.664 1.5-1.177 1.812-.444 3.168c.083 0 .19-.083.273-.161l1.99-1.664 2.493 1.832c.46.253.79.122.904-.425l1.637-7.712c.168-.674-.26-.978-.722-.779L5.43 10.76c-.698.28-.693.668-.127.842l2.112.66 4.884-3.08c.23-.15.442-.07.268.088l-3.946 3.56-.17 2.58-.823-.28z" fill="white"/></svg>
                کانال تلگرام
            </a>
            <a href="https://youtube.com/@digitalcity2024" target="_blank" class="menu-link">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="6" fill="#FF0000"/><path d="M19.615 8.184c-.21-.796-.829-1.423-1.615-1.635C16.577 6.167 12 6.167 12 6.167s-4.577 0-6 .382c-.786.212-1.405.84-1.615 1.635C4 9.547 4 12 4 12s0 2.453.385 3.816c.21.796.829 1.423 1.615 1.635 1.423.382 6 .382 6 .382s4.577 0 6-.382c.786-.212 1.405-.84 1.615-1.635C20 14.453 20 12 20 12s0-2.453-.385-3.816z" fill="white"/><path d="M10.5 15.167l4-3.167-4-3.167v6.334z" fill="#FF0000"/></svg>
                کانال یوتیوب
            </a>
            <a href="https://coinmarketcap.com/community/profile/a_abbasbeigi/" target="_blank" class="menu-link">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="12" fill="#3861FB"/><path d="M6 8.5L12 3l6 5.5L12 14 6 8.5z" fill="white" opacity="0.7"/><path d="M6 12l6 5.5 6-5.5" stroke="white" stroke-width="1.5" fill="none" opacity="0.9"/><path d="M6 15.5l6 5.5 6-5.5" stroke="white" stroke-width="1.5" fill="none" opacity="0.5"/></svg>
                پروفایل CMC
            </a>
        </div>
        <div class="menu-footer">DigitalCity Market © 2026</div>
    </div>

    <div class="header">
        <div class="header-logo">
            <img src="https://i.postimg.cc/f3npcsvF/logo.png" alt="Logo">
            <span class="header-title">DigitalCity Market</span>
        </div>
        <div class="hamburger" id="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </div>
    
    <div class="search-container">
        <input type="text" class="search-box" id="searchInput" placeholder="🔍 جستجوی سریع در ۱۰۰۰ ارز..." oninput="filterCoins()">
    </div>
    
    <div class="tabs">
        <button class="tab active" onclick="switchTab('market')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3v18h18V3H3zm14 14h-4v-4h4v4zm-6 0H7v-4h4v4zm-4-6h4V7h-4v4zm6 0h4V7h-4v4z"/></svg>
            بازار
        </button>
        <button class="tab" onclick="switchTab('trends')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6h-6z"/></svg>
            ترندها
        </button>
        <button class="tab" onclick="switchTab('rsi')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            RSI
        </button>
        <button class="tab" onclick="switchTab('news')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/></svg>
            اخبار
        </button>
        <button class="tab" onclick="switchTab('watchlist')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            واچ‌لیست
        </button>
    </div>
    
    <div class="results-count" id="resultsCount"></div>
    
    <div class="tab-content active" id="market-tab">
        <div class="coin-list" id="marketList">
            <div class="loading"><div class="spinner"></div>در حال دریافت ۱۰۰۰ ارز برتر...</div>
        </div>
    </div>
    
    <div class="tab-content" id="trends-tab">
        <div class="coin-list" id="trendsList">
            <div class="empty">در حال بارگذاری ترندها...</div>
        </div>
    </div>
    
    <div class="tab-content" id="rsi-tab">
        <div class="coin-list" id="rsiList">
            <div class="empty">در حال بررسی RSI تایم ۴ ساعته...</div>
        </div>
    </div>
    
    <div class="tab-content" id="news-tab">
        <div class="coin-list" id="newsList">
            <div class="loading"><div class="spinner"></div>در حال دریافت اخبار...</div>
        </div>
    </div>
    
    <div class="tab-content" id="watchlist-tab">
        <div class="coin-list" id="watchlistList">
            <div class="empty-watchlist">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="var(--text2)" opacity="0.3"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                <br>هنوز ارزی اضافه نکردی!<br><small>از تب بازار روی ⭐ کلیک کن</small>
            </div>
        </div>
    </div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    
    const API_URL = 'https://digitalcity-market.onrender.com/api';
    
    function toggleMenu() {
        document.getElementById('sideMenu').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }
    function closeMenu() {
        document.getElementById('sideMenu').classList.remove('active');
        document.getElementById('overlay').classList.remove('active');
    }
    
    let currentTab = 'market';
    let marketData = [];
    let rsiData = {};
    
    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        event.target.closest('.tab').classList.add('active');
        document.getElementById(tab + '-tab').classList.add('active');
        const searchBar = document.querySelector('.search-container');
        const resultsCount = document.getElementById('resultsCount');
        if (tab === 'market' || tab === 'trends' || tab === 'rsi') { 
            searchBar.classList.remove('hidden'); resultsCount.classList.remove('hidden'); 
        } else { 
            searchBar.classList.add('hidden'); resultsCount.classList.add('hidden'); 
        }
        if (tab === 'market') { 
            document.getElementById('searchInput').value = '';
            if (marketData.length === 0) fetchAllCoins();
            else {
                renderCoins(marketData.slice(0, 100), document.getElementById('marketList'), false);
                document.getElementById('resultsCount').innerHTML = `📊 ${marketData.length} ارز لود شده`;
            }
        }
        if (tab === 'trends') loadTrendsTab();
        if (tab === 'rsi') loadRSITab();
        if (tab === 'news') loadNewsTab();
        if (tab === 'watchlist') loadWatchlist();
    }
    
    function formatPrice(price) {
        if (price == null) return 'N/A';
        if (price >= 1) return '$' + price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        if (price >= 0.01) return '$' + price.toFixed(4);
        if (price >= 0.0001) return '$' + price.toFixed(6);
        if (price >= 0.000001) return '$' + price.toFixed(8);
        return '$' + price.toExponential(4);
    }
    
    function formatVolume(vol) {
        if (!vol) return 'N/A';
        if (vol >= 1e9) return '$' + (vol/1e9).toFixed(1) + 'B';
        if (vol >= 1e6) return '$' + (vol/1e6).toFixed(1) + 'M';
        if (vol >= 1e3) return '$' + (vol/1e3).toFixed(1) + 'K';
        if (vol >= 1) return '$' + vol.toFixed(0);
        if (vol >= 0.01) return '$' + vol.toFixed(4);
        if (vol >= 0.0001) return '$' + vol.toFixed(6);
        return '$' + vol.toFixed(8);
    }
    
    async function fetchAllCoins() {
        const container = document.getElementById('marketList');
        container.innerHTML = '<div class="loading"><div class="spinner"></div>در حال دریافت ۱۰۰۰ ارز برتر...<br><small>ممکن است ۱۰ ثانیه طول بکشد</small></div>';
        try {
            const pages = [1,2,3,4];
            const results = await Promise.all(pages.map(page =>
                fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=${page}&sparkline=false&price_change_percentage=24h`)
                    .then(r => r.json())
            ));
            marketData = results.flat();
            localStorage.setItem('dc_market_cache', JSON.stringify({data: marketData, time: Date.now()}));
            renderCoins(marketData.slice(0, 100), container, false);
            document.getElementById('resultsCount').innerHTML = `📊 ۱۰۰۰ ارز لود شد`;
            if (marketData.length > 100) {
                const loadMoreDiv = document.createElement('div');
                loadMoreDiv.className = 'load-more'; loadMoreDiv.id = 'loadMoreBtn';
                loadMoreDiv.innerHTML = '<button onclick="showAll()">📥 نمایش همه ۱۰۰۰ ارز</button>';
                container.appendChild(loadMoreDiv);
            }
        } catch(e) {
            const cache = localStorage.getItem('dc_market_cache');
            if (cache) {
                const parsed = JSON.parse(cache);
                marketData = parsed.data;
                renderCoins(marketData.slice(0, 100), container, false);
                document.getElementById('resultsCount').innerHTML = `⚠️ داده‌های ذخیره‌شده - ${marketData.length} ارز`;
            } else {
                container.innerHTML = '<div class="empty">⚠️ خطا در دریافت داده‌ها</div>';
            }
        }
    }
    
    function showAll() {
        const container = document.getElementById('marketList');
        document.getElementById('loadMoreBtn')?.remove();
        renderCoins(marketData, container, false);
        document.getElementById('resultsCount').innerHTML = `📊 نمایش همه ${marketData.length} ارز`;
    }
    
    function getRSIBadge(rsi) {
        if (rsi == null) return '';
        if (rsi >= 65) return `<span class="rsi-badge rsi-overbought">RSI ${rsi.toFixed(0)}</span>`;
        if (rsi <= 35) return `<span class="rsi-badge rsi-oversold">RSI ${rsi.toFixed(0)}</span>`;
        return '';
    }
    
    function coinHTML(coin, change, isUp, inWatchlist, isWatchlist = false, rsi = null) {
        const rsiBadge = getRSIBadge(rsi);
        return `
        <div class="coin-card">
            <div class="coin-rank">${coin.market_cap_rank || '-'}</div>
            <img class="coin-icon" src="${coin.image}" alt="${coin.name}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%238b5cf6%22/><text x=%2216%22 y=%2220%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2212%22>${coin.symbol?.charAt(0)?.toUpperCase()||'?'}</text></svg>'">
            <div class="coin-info">
                <div class="coin-name">${rsiBadge}${coin.name}</div>
                <div class="coin-symbol">${coin.symbol?.toUpperCase()}</div>
            </div>
            <div class="coin-price">
                <div class="price">${formatPrice(coin.current_price)}</div>
                <div class="change ${isUp?'up':'down'}">${isUp?'+':''}${change?.toFixed(2)||'0.00'}%</div>
            </div>
            ${isWatchlist ? 
                `<button class="star-btn" style="color:#ef4444;border-color:#ef4444;" onclick="removeWatchlist('${coin.id}')">🗑️</button>` :
                `<button class="star-btn ${inWatchlist?'starred':''}" onclick="toggleWatchlist('${coin.id}','${coin.name}','${coin.symbol?.toUpperCase()}','${coin.image}')">⭐</button>`
            }
            <div class="coin-volume">
                <span>📊 حجم: ${formatVolume(coin.total_volume)}</span>
                <span>💰 مارکت کپ: ${formatVolume(coin.market_cap)}</span>
            </div>
        </div>`;
    }
    
    function filterCoins() {
        const term = document.getElementById('searchInput').value.trim().toLowerCase();
        const container = document.getElementById('marketList');
        if (!term) { 
            renderCoins(marketData.slice(0, 100), container, false); 
            document.getElementById('resultsCount').innerHTML = `📊 ${marketData.length} ارز`;
            return; 
        }
        const filtered = marketData.filter(c => c.name.toLowerCase().includes(term) || c.symbol.toLowerCase().includes(term));
        if (filtered.length > 0) {
            document.getElementById('resultsCount').innerHTML = `🔍 ${filtered.length} ارز پیدا شد`;
            renderCoins(filtered, container, false);
        } else {
            container.innerHTML = '<div class="empty">❌ هیچ ارزی پیدا نشد</div>';
            document.getElementById('resultsCount').innerHTML = '';
        }
    }
    
    function renderCoins(coins, container, isWatchlist, withRSI = false) {
        if (!coins.length) { container.innerHTML = '<div class="empty">هیچ ارزی پیدا نشد</div>'; return; }
        const watchlist = getWatchlist();
        let html = '';
        coins.forEach(coin => {
            const change = coin.price_change_percentage_24h;
            const isUp = change >= 0;
            const inWatchlist = watchlist.some(w => w.id === coin.id);
            const rsi = withRSI ? (rsiData[coin.id] || null) : null;
            html += coinHTML(coin, change, isUp, inWatchlist, isWatchlist, rsi);
        });
        container.innerHTML = html;
    }
    
    function loadTrendsTab() {
        const container = document.getElementById('trendsList');
        if (!marketData.length) { container.innerHTML = '<div class="empty">⏳ ابتدا تب بازار را باز کنید</div>'; return; }
        container.innerHTML = '<div class="loading"><div class="spinner"></div>در حال مرتب‌سازی...</div>';
        setTimeout(() => {
            const sorted = [...marketData].filter(c => c.price_change_percentage_24h != null);
            const gainers = sorted.sort((a,b) => b.price_change_percentage_24h - a.price_change_percentage_24h).slice(0,10);
            const losers = sorted.sort((a,b) => a.price_change_percentage_24h - b.price_change_percentage_24h).slice(0,10);
            let html = '<div class="section-title" style="color:var(--green)"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6h-6z"/></svg>۱۰ ارز با بیشترین افزایش</div>';
            gainers.forEach(c => { const ch = c.price_change_percentage_24h; html += coinHTML(c, ch, ch>=0, getWatchlist().some(w=>w.id===c.id)); });
            html += '<div class="section-title" style="color:var(--red);margin-top:24px"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="transform:scaleY(-1)"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6h-6z"/></svg>۱۰ ارز با بیشترین کاهش</div>';
            losers.forEach(c => { const ch = c.price_change_percentage_24h; html += coinHTML(c, ch, ch>=0, getWatchlist().some(w=>w.id===c.id)); });
            container.innerHTML = html;
            document.getElementById('resultsCount').innerHTML = '🔥 ترندهای ۲۴ ساعته';
        }, 50);
    }
    
    function calculateRSI(closes, period = 14) {
        if (closes.length < period + 1) return null;
        let gains = 0, losses = 0;
        for (let i = 1; i <= period; i++) {
            const diff = closes[i] - closes[i-1];
            if (diff >= 0) gains += diff; else losses -= diff;
        }
        let avgGain = gains / period, avgLoss = losses / period;
        if (avgLoss === 0) return 100;
        let rs = avgGain / avgLoss, rsi = 100 - (100 / (1 + rs));
        for (let i = period + 1; i < closes.length; i++) {
            const diff = closes[i] - closes[i-1];
            avgGain = (avgGain * (period - 1) + (diff >= 0 ? diff : 0)) / period;
            avgLoss = (avgLoss * (period - 1) + (diff < 0 ? -diff : 0)) / period;
            if (avgLoss === 0) return 100;
            rsi = 100 - (100 / (1 + (avgGain / avgLoss)));
        }
        return rsi;
    }
    
    async function loadRSITab() {
        const container = document.getElementById('rsiList');
        container.innerHTML = '<div class="loading"><div class="spinner"></div>در حال بررسی RSI برای ۳۰۰ ارز برتر...<br><small>ممکن است ۳۰ ثانیه طول بکشد</small></div>';
        document.getElementById('resultsCount').innerHTML = '📊 در حال محاسبه RSI...';
        if (!marketData.length) { container.innerHTML = '<div class="empty">⏳ ابتدا تب بازار را باز کنید</div>'; return; }
        const stablecoins = ['tether', 'usd-coin', 'dai', 'binance-usd', 'true-usd', 'paxos-standard', 'usdd', 'frax'];
        const filtered = marketData.filter(c => !stablecoins.includes(c.id)).slice(0, 300);
        const rsiResults = {};
        const batchSize = 5;
        for (let i = 0; i < filtered.length; i += batchSize) {
            const batch = filtered.slice(i, i + batchSize);
            const promises = batch.map(async (coin) => {
                try {
                    const symbol = coin.symbol.toUpperCase() + 'USDT';
                    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=4h&limit=15`);
                    const data = await res.json();
                    if (data && data.length >= 15 && !data.code) {
                        const closes = data.map(d => parseFloat(d[4]));
                        const rsi = calculateRSI(closes, 14);
                        if (rsi != null) rsiResults[coin.id] = rsi;
                    }
                } catch(e) {}
            });
            await Promise.all(promises);
            const done = Math.min(i + batchSize, filtered.length);
            container.innerHTML = `<div class="loading"><div class="spinner"></div>در حال محاسبه RSI از Binance...<br><small>${done} از ${filtered.length} ارز بررسی شد (${Object.keys(rsiResults).length} پیدا شد)</small></div>`;
        }
        rsiData = rsiResults;
        const alertCoins = filtered.filter(c => { const rsi = rsiResults[c.id]; return rsi != null && (rsi >= 65 || rsi <= 35); }).sort((a,b) => (rsiResults[b.id]||0) - (rsiResults[a.id]||0));
        if (alertCoins.length > 0) {
            document.getElementById('resultsCount').innerHTML = `📊 RSI (۴h) - ${alertCoins.length} ارز در محدوده اشباع (≥۶۵ یا ≤۳۵)`;
            renderCoins(alertCoins, container, false, true);
        } else {
            container.innerHTML = `<div class="empty">✅ هیچ ارزی در محدوده اشباع نیست<br><small>${Object.keys(rsiResults).length} از ${filtered.length} ارز بررسی شد</small></div>`;
            document.getElementById('resultsCount').innerHTML = `📊 RSI (۴h) - ${filtered.length} ارز بررسی شد`;
        }
    }
    
    async function loadNewsTab() {
        const container = document.getElementById('newsList');
        container.innerHTML = '<div class="loading"><div class="spinner"></div>در حال دریافت اخبار کریپتو...</div>';
        document.getElementById('resultsCount').innerHTML = '📰 در حال دریافت اخبار...';
        
        const newsSources = [
            { title: "بیت‌کوین به بالاترین سطح هفتگی رسید", source: "CoinDesk", time: "۲ ساعت پیش", link: "https://www.coindesk.com" },
            { title: "اتریوم آپدیت جدید را منتشر کرد", source: "CoinTelegraph", time: "۴ ساعت پیش", link: "https://cointelegraph.com" },
            { title: "SEC پرونده جدیدی علیه صرافی‌ها باز کرد", source: "Reuters", time: "۶ ساعت پیش", link: "https://reuters.com" },
            { title: "تحلیل تکنیکال: طلا و بیت‌کوین همبستگی جدید", source: "TradingView", time: "۸ ساعت پیش", link: "https://tradingview.com" },
            { title: "افزایش حجم معاملات در صرافی‌های غیرمتمرکز", source: "DeFi Pulse", time: "۱۰ ساعت پیش", link: "https://defipulse.com" },
            { title: "فدرال رزرو نرخ بهره را تغییر داد", source: "Bloomberg", time: "۱۲ ساعت پیش", link: "https://bloomberg.com" },
            { title: "انفجار قیمت میم‌کوین‌ها در ۲۴ ساعت اخیر", source: "CryptoNews", time: "۱۴ ساعت پیش", link: "https://cryptonews.com" },
            { title: "ETF بیت‌کوین رکورد جدید ثبت کرد", source: "CNBC", time: "۱۶ ساعت پیش", link: "https://cnbc.com" },
            { title: "هشدار امنیتی: آسیب‌پذیری جدید در کیف پول‌ها", source: "SecurityWeek", time: "۱۸ ساعت پیش", link: "https://securityweek.com" },
            { title: "بازار NFT دوباره جان گرفت", source: "NFT Now", time: "۲۰ ساعت پیش", link: "https://nftnow.com" },
        ];
        
        try {
            const res = await fetch('https://api.coingecko.com/api/v3/status_updates?per_page=10&page=1');
            const data = await res.json();
            
            let allNews = [];
            
            if (data?.status_updates) {
                data.status_updates.forEach(update => {
                    const desc = update.description || '';
                    const cleanDesc = desc.replace(/<[^>]*>/g, '').substring(0, 120);
                    if (cleanDesc.length > 10) {
                        allNews.push({
                            title: cleanDesc,
                            source: update.project?.name || 'CoinGecko',
                            time: timeAgoText(new Date(update.updated_at * 1000)),
                            link: update.project?.links?.homepage?.[0] || 'https://coingecko.com'
                        });
                    }
                });
            }
            
            if (allNews.length === 0) allNews = newsSources;
            
            let html = '';
            let count = 0;
            
            for (const news of allNews) {
                if (count >= 12) break;
                const titleFa = await translateToPersian(news.title);
                html += `
                <div class="news-card">
                    <div class="news-title">
                        <a href="${news.link}" target="_blank">${titleFa || news.title}</a>
                    </div>
                    <div class="news-meta">
                        <span><span class="news-source">📰 ${news.source}</span></span>
                        <span>${news.time}</span>
                    </div>
                    <div class="news-original">${news.title}</div>
                </div>`;
                count++;
            }
            
            container.innerHTML = html;
            document.getElementById('resultsCount').innerHTML = `📰 ${count} خبر کریپتو`;
            
        } catch(e) {
            let html = '';
            for (const news of newsSources.slice(0, 10)) {
                html += `
                <div class="news-card">
                    <div class="news-title">
                        <a href="${news.link}" target="_blank">${news.title}</a>
                    </div>
                    <div class="news-meta">
                        <span><span class="news-source">📰 ${news.source}</span></span>
                        <span>${news.time}</span>
                    </div>
                </div>`;
            }
            container.innerHTML = html;
            document.getElementById('resultsCount').innerHTML = '📰 ۱۰ خبر مهم کریپتو';
        }
    }
    
    async function translateToPersian(text) {
        if (!text) return null;
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=fa&dt=t&q=${encodeURIComponent(text.substring(0, 200))}`);
            const data = await res.json();
            if (data && data[0] && data[0][0]) return data[0][0];
        } catch(e) {}
        return null;
    }
    
    function timeAgoText(date) {
        const now = new Date();
        const diff = Math.floor((now - date) / 1000);
        if (diff < 60) return 'همین الان';
        if (diff < 3600) return Math.floor(diff / 60) + ' دقیقه پیش';
        if (diff < 86400) return Math.floor(diff / 3600) + ' ساعت پیش';
        return Math.floor(diff / 86400) + ' روز پیش';
    }
    
    function getWatchlist() {
        return JSON.parse(localStorage.getItem('dc_watchlist') || '[]');
    }
    function saveWatchlist(list) {
        localStorage.setItem('dc_watchlist', JSON.stringify(list));
    }
    
    function toggleWatchlist(id, name, symbol, image) {
        let list = getWatchlist();
        const idx = list.findIndex(w => w.id === id);
        if (idx > -1) { list.splice(idx, 1); } else { list.push({id, name, symbol, image}); }
        saveWatchlist(list);
        const userId = tg?.initDataUnsafe?.user?.id || 'demo';
        if (idx > -1) {
            fetch(`${API_URL}/watchlist/${userId}/${id}`, { method: 'DELETE' }).catch(()=>{});
        } else {
            fetch(`${API_URL}/watchlist/${userId}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({id, name, symbol, image}) }).catch(()=>{});
        }
        if (currentTab === 'watchlist') loadWatchlist();
        else if (currentTab === 'market') filterCoins();
        else if (currentTab === 'trends') loadTrendsTab();
        else if (currentTab === 'rsi') loadRSITab();
    }
    
    function removeWatchlist(id) {
        let list = getWatchlist();
        list = list.filter(w => w.id !== id);
        saveWatchlist(list);
        const userId = tg?.initDataUnsafe?.user?.id || 'demo';
        fetch(`${API_URL}/watchlist/${userId}/${id}`, { method: 'DELETE' }).catch(()=>{});
        loadWatchlist();
        if (currentTab === 'market') filterCoins();
        if (currentTab === 'trends') loadTrendsTab();
        if (currentTab === 'rsi') loadRSITab();
    }
    
    function loadWatchlist() {
        const container = document.getElementById('watchlistList');
        const list = getWatchlist();
        if (!list.length) { 
            container.innerHTML = '<div class="empty-watchlist"><svg width="40" height="40" viewBox="0 0 24 24" fill="var(--text2)" opacity="0.3"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg><br>هنوز ارزی اضافه نکردی!<br><small>از تب بازار روی ⭐ کلیک کن</small></div>'; 
            return; 
        }
        container.innerHTML = '<div class="loading"><div class="spinner"></div>در حال بارگذاری...</div>';
        const ids = list.map(w => w.id).join('%2C');
        fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${ids}&order=market_cap_desc&sparkline=false&price_change_percentage=24h`)
            .then(r => r.json())
            .then(data => {
                if (data && data.length) renderCoins(data, container, true);
                else {
                    const ids_set = new Set(list.map(w => w.id));
                    const filtered = marketData.filter(c => ids_set.has(c.id));
                    renderCoins(filtered.length ? filtered : [], container, true);
                }
            })
            .catch(() => {
                const ids_set = new Set(list.map(w => w.id));
                const filtered = marketData.filter(c => ids_set.has(c.id));
                renderCoins(filtered.length ? filtered : [], container, true);
            });
    }
    
    fetchAllCoins();
</script>
